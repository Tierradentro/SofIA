# SofIA Logística Inteligente — servicios según Spec §9.
# El esquema de BD se crea con las migraciones del backend al arrancar
# (siempre, son idempotentes) y las semillas I0 también son idempotentes.

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sofia_app
      POSTGRES_PASSWORD: sofia_secret
      POSTGRES_DB: sofia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sofia_app -d sofia']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: sofia_app
      DB_PASSWORD: sofia_secret
      DB_NAME: sofia
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el entorno}
      JWT_EXPIRES_IN: 8h
      OCR_ENCRYPTION_KEY: ${OCR_ENCRYPTION_KEY:?Defina OCR_ENCRYPTION_KEY en el entorno}
      REDIS_URL: redis://redis:6379
      FILES_DIR: /data/files
      EXPORTS_DIR: /data/exports
      OCR_WORKER_URL: http://ocr-worker:3100
      # I31: migraciones y semillas corren siempre al arrancar (idempotentes);
      # no hay RUN_MIGRATIONS/SEED_ON_BOOT que las desactive por error.
    volumes:
      - files:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ocr-worker:
    restart: unless-stopped
    build: ./ocr-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      FILES_DIR: /data/files
    volumes:
      - files:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        # URL pública del API tal como la verá el navegador (nginx expone /api/)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      - backend

  nginx:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # I37b: sin healthcheck EasyPanel no sabía cuándo el enrutador estaba
    # sano y respondía 502 "Service is not reachable" en /api/* tras un
    # redespliegue, aunque backend y frontend estuvieran vivos. nginx sirve
    # /healthz propio (definido en nginx.conf) para el chequeo.
    healthcheck:
      # nginx -t valida la configuración y confirma que el proceso principal
      # responde; nginx:alpine siempre incluye el binario (a diferencia de
      # wget/curl, que no están garantizados en la imagen alpine).
      test: ['CMD-SHELL', 'nginx -t 2>/dev/null && pgrep nginx >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Esperar a que backend y frontend estén listos antes de enrutar tráfico:
    # así el proxy nunca queda apuntando a servicios aún no arrancados.
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  pgdata:
  files:
