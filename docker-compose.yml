# SofIA Logística Inteligente — servicios según Spec §9.
# El esquema de BD se crea con las migraciones del backend al arrancar
# (siempre, son idempotentes) y las semillas I0 también son idempotentes.

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      # AJ-007: sin credenciales literales en el repositorio. POSTGRES_PASSWORD
      # se define como variable protegida en EasyPanel. IMPORTANTE: en una BD
      # ya inicializada esta variable NO cambia la contraseña existente; debe
      # coincidir con la contraseña actual de la base de datos.
      POSTGRES_USER: ${POSTGRES_USER:-sofia_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el entorno (la contraseña actual de la BD)}
      POSTGRES_DB: ${POSTGRES_DB:-sofia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-sofia_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el entorno (la contraseña actual de la BD)}
      DB_NAME: ${POSTGRES_DB:-sofia}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el entorno}
      JWT_EXPIRES_IN: 8h
      OCR_ENCRYPTION_KEY: ${OCR_ENCRYPTION_KEY:?Defina OCR_ENCRYPTION_KEY en el entorno}
      REDIS_URL: redis://redis:6379
      FILES_DIR: /data/files
      EXPORTS_DIR: /data/exports
      OCR_WORKER_URL: http://ocr-worker:3100
      # I31: migraciones y semillas corren siempre al arrancar (idempotentes);
      # no hay RUN_MIGRATIONS/SEED_ON_BOOT que las desactive por error.
    volumes:
      - files:/data
    # AJ-006/I50: healthcheck con Node (mismo patrón del frontend; registra
    # el error en State.Health.Log). /api/v1/health responde 200 apenas el
    # puerto abre — la BD se conecta en segundo plano — y reporta "degradado"
    # en el cuerpo mientras corren migraciones (readiness disponible sin
    # tumbar el contenedor). Márgenes amplios para el arranque en frío.
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"http.get('http://127.0.0.1:3001/api/v1/health',r=>{console.log('health',r.statusCode);process.exit(r.statusCode<500?0:1)}).on('error',e=>{console.log('health-error',e.code||e.message);process.exit(1)})\""
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ocr-worker:
    restart: unless-stopped
    build: ./ocr-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      FILES_DIR: /data/files
    volumes:
      - files:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        # AJ-002: URL RELATIVA — el navegador resuelve /api/v1 contra el
        # dominio público (HTTPS) y nginx lo enruta al backend por la red
        # interna. Nada de localhost:8080 en producción. Es variable de BUILD
        # (NEXT_PUBLIC_*): cualquier cambio exige reconstruir el frontend.
        # Todos los consumos de API son del lado del navegador (componentes
        # 'use client'); no hay fetch desde el servidor Next.js.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    # AJ-006/I50: healthcheck implementado con Node (siempre presente en la
    # imagen — no depende de busybox/wget). Además de marcar el estado,
    # registra el resultado en el log de salud del contenedor, visible con
    # `docker inspect` → State.Health.Log: si vuelve a fallar se verá el
    # error exacto (ECONNREFUSED, timeout, etc.) en lugar de un silencio.
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"http.get('http://127.0.0.1:3000/login',r=>{console.log('health',r.statusCode);process.exit(r.statusCode<500?0:1)}).on('error',e=>{console.log('health-error',e.code||e.message);process.exit(1)})\""
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 45s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    image: nginx:alpine
    # AJ-001: sin publicación de puertos en el host. EasyPanel enruta el
    # dominio HTTPS directamente al puerto interno 80 por la red Docker;
    # `expose` lo documenta y lo mantiene accesible entre contenedores.
    # Así desaparece el warning "ports is used in nginx. It might cause
    # conflicts with other services" y no hay choques con otros proyectos.
    expose:
      - '80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # I37b: sin healthcheck EasyPanel no sabía cuándo el enrutador estaba
    # sano y respondía 502 "Service is not reachable" en /api/* tras un
    # redespliegue, aunque backend y frontend estuvieran vivos. nginx sirve
    # /healthz propio (definido en nginx.conf) para el chequeo.
    healthcheck:
      # AJ-006: chequeo HTTP real contra /healthz (no solo `nginx -t`, que
      # valida la configuración pero no la disponibilidad). wget es el
      # applet de busybox incluido en nginx:alpine.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Esperar a que el backend esté SANO antes de enrutar tráfico (su health
    # responde apenas abre el puerto). I50: el frontend vuelve a
    # service_started — nginx NO debe bloquearse por él: con el resolver
    # dinámico (I37c) re-resuelve y reintenta en cada petición, así el
    # despliegue nunca se cae por un falso unhealthy del frontend (fue la
    # causa del fracaso de I47/I48/I49) y el AJ-006 queda cumplido: EasyPanel
    # vigila al proxy por /healthz, que no depende de backend ni frontend.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  files:
