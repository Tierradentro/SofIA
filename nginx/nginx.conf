# I73 (auditoría, hallazgo 6): límite de tasa sobre el endpoint de login.
# `limit_req_zone` solo puede declararse en el contexto http; este archivo se
# monta en /etc/nginx/conf.d/default.conf, que nginx incluye DENTRO del bloque
# http, así que la directiva es válida aquí.
#
# NOTA sobre la clave: detrás del proxy de borde de EasyPanel (Traefik) TODAS
# las peticiones llegan con la IP interna del proxy, así que $binary_remote_addr
# actúa como un freno GLOBAL del login (no por cliente). No se usa
# $http_x_forwarded_for porque el cliente la puede falsificar y rotar para
# evadir el límite. La tasa se calibra para no castigar el arranque de turno
# (varios empleados entrando a la vez): la defensa anti-fuerza-bruta por
# cuenta es el bloqueo temporal de 15 min del backend (auth.service.ts); esta
# capa corta ráfagas automatizadas (cientos por minuto) y el DoS del endpoint.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # I73: devolver 429 (Too Many Requests) en lugar del 503 por defecto
    # cuando limit_req rechaza una petición.
    limit_req_status 429;

    # I37c: resolver el DNS interno de Docker en CADA petición, no solo al
    # arrancar. Con `proxy_pass http://backend:3001` (nombre literal) nginx
    # resuelve "backend" una sola vez al iniciar y guarda la IP en caché para
    # siempre. Cuando EasyPanel redespliega, el contenedor del backend recibe
    # una IP NUEVA y nginx sigue enviando el tráfico a la IP vieja (que ya no
    # existe) → 502 "Service is not reachable" hasta reiniciar nginx. Por eso
    # el error volvía tras cada publicación.
    #
    # Al usar una VARIABLE en proxy_pass, nginx delega la resolución en el
    # `resolver` (el DNS embebido de Docker, 127.0.0.11) y la refresca con el
    # TTL indicado: tras un redespliegue la IP nueva se retoma sola en unos
    # segundos, sin tocar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # I37b: endpoint propio del enrutador para el healthcheck de EasyPanel.
    # Responde sin tocar backend ni frontend: certifica que nginx está vivo.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"enrutador":"ok"}';
    }

    # I73 (auditoría, hallazgo 6): rate limiting SOLO para el login.
    # Coincidencia exacta: entra antes que el `location /api/` genérico.
    # burst=15 absorbe el arranque de turno; más allá, 429 sin tocar el
    # backend (ver la nota sobre la clave global en limit_req_zone).
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=15 nodelay;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        # Variable + resolver → re-resolución en cada petición (I37c).
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AJ-003: el proxy de borde de EasyPanel (Traefik) fija
        # X-Forwarded-Proto con el protocolo original (https); aquí solo se
        # PROPAGA, no se inventa. Si la petición no lo trae, la cabecera
        # llega vacía y el backend sigue funcionando con Bearer tokens (no
        # depende de cookies seguras ni hace redirecciones por esquema).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # AJ-005: HTTP/1.1 y timeouts acotados. Lectura/envío en 120s cubren
        # las cargas de archivos (máx. 25 MB) y el procesamiento OCR; la
        # conexión falla rápido (10s) si el upstream está caído. No hay
        # WebSocket/SSE en la aplicación: no se requieren cabeceras Upgrade.
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
