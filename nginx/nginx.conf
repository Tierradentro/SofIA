server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # I37c: resolver el DNS interno de Docker en CADA petición, no solo al
    # arrancar. Con `proxy_pass http://backend:3001` (nombre literal) nginx
    # resuelve "backend" una sola vez al iniciar y guarda la IP en caché para
    # siempre. Cuando EasyPanel redespliega, el contenedor del backend recibe
    # una IP NUEVA y nginx sigue enviando el tráfico a la IP vieja (que ya no
    # existe) → 502 "Service is not reachable" hasta reiniciar nginx. Por eso
    # el error volvía tras cada publicación.
    #
    # Al usar una VARIABLE en proxy_pass, nginx delega la resolución en el
    # `resolver` (el DNS embebido de Docker, 127.0.0.11) y la refresca con el
    # TTL indicado: tras un redespliegue la IP nueva se retoma sola en unos
    # segundos, sin tocar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # I37b: endpoint propio del enrutador para el healthcheck de EasyPanel.
    # Responde sin tocar backend ni frontend: certifica que nginx está vivo.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"enrutador":"ok"}';
    }

    location /api/ {
        # Variable + resolver → re-resolución en cada petición (I37c).
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
